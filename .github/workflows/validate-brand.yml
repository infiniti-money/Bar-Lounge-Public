name: Validate Cera Day & Night guest website
on:
  push:
    branches: [brand/cera-day-night-glass]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify brand, map, photos and CSS
        run: node --test tests/brand.test.mjs
